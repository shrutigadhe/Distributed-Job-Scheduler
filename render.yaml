services:
  # ── Backend API ──────────────────────────────────────────────
  - type: web
    name: jobflow-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
    healthCheckPath: /

  # ── Worker Process ───────────────────────────────────────────
  - type: worker
    name: jobflow-worker
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt && pip install -r worker/requirements.txt
    startCommand: PYTHONPATH=backend python worker/worker_main.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobflow-db
          property: connectionString
      - key: WORKER_NAME
        value: jobflow-worker-1

# ── PostgreSQL Database ──────────────────────────────────────
databases:
  - name: jobflow-db
    databaseName: jobflow
    user: jobflow_user
    plan: free
