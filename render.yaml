services:
  # ── Backend API ──────────────────────────────────────────────
  - type: web
    name: jobflow-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
    healthCheckPath: /

  # ── Worker Process ───────────────────────────────────────────
  - type: worker
    name: jobflow-worker
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m worker.worker_main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobflow-db
          property: connectionString

# ── PostgreSQL Database ──────────────────────────────────────
databases:
  - name: jobflow-db
    databaseName: jobflow
    user: jobflow_user
    plan: free
